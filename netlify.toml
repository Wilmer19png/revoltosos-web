# Sitio estático: no hay build, se publica la carpeta tal cual.
[build]
  publish = "."

# El panel de pedidos nunca debe aparecer en buscadores.
[[headers]]
  for = "/pedidos/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Imágenes y videos: se guardan en el celular por una semana.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS y JS: el celular pregunta siempre si hay versión nueva (si no cambió, no se descarga de nuevo).
# Además, al cambiarlos hay que subir el número ?v= en las páginas que los cargan
# (index.html, codornices/, cajita/ y producto/).
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# La vieja prueba de "1 frasco" ahora es la landing de codornices.
[[redirects]]
  from = "/codornices/unidad/*"
  to = "/codornices/"
  status = 301

# Material interno que no hace falta servir.
[[redirects]]
  from = "/Recursos*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/diseno/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/herramientas/*"
  to = "/"
  status = 404
  force = true

# Formulario de reseñas: no hace falta que aparezca en Google.
[[headers]]
  for = "/opina/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Lista de municipios: cambia muy poco.
[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Combos retirados en noviembre de 2026 (migración 027): sus links viejos (anuncios, WhatsApp)
