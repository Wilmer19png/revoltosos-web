# Sitio estático: no hay build, se publica la carpeta tal cual.
[build]
  publish = "."

# El panel de pedidos nunca debe aparecer en buscadores.
[[headers]]
  for = "/pedidos/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Imágenes: se guardan en el celular por una semana.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Variante oculta de prueba (1 frasco a $14.900): usa la misma página que la principal.
[[headers]]
  for = "/codornices/unidad/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/codornices/unidad"
  to = "/codornices/unidad/"
  status = 301

[[redirects]]
  from = "/codornices/unidad/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/codornices/*"
  to = "/"
  status = 301

# Material interno que no hace falta servir.
[[redirects]]
  from = "/Recursos*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/diseno/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/"
  status = 404
  force = true
