# Sitio estático: no hay build, se publica la carpeta tal cual.
[build]
  publish = "."

# El panel de pedidos nunca debe aparecer en buscadores.
[[headers]]
  for = "/pedidos/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Imágenes: se guardan en el celular por una semana.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Material interno que no hace falta servir.
[[redirects]]
  from = "/Recursos*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/diseno/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/"
  status = 404
  force = true
